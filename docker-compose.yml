version: '3.8'

services:
  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - JWT_SECRET=eventhub_secure_hackathon_jwt_secret_2026
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=eventhub_password
      - DB_NAME=eventhub_db
      - DB_PORT=3306
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=eventhub_password
      - MYSQL_DATABASE=eventhub_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
